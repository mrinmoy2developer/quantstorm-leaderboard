# Reverse proxy for the Divided Oracle open leaderboard — quantstorm.mrinmoy.org
#
#   sudo cp ~/quantstorm-ladder/ladder/quantstorm.nginx.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d quantstorm.mrinmoy.org
#
# Deliberately NOT default_server — same reasoning as generals-relay.nginx.conf:
# Rocky ships a default :80 server block, and an explicit server_name lets this
# block coexist with it instead of colliding.
#
# certbot --nginx rewrites this file in place to add the :443 block and the
# :80 -> :443 redirect, exactly as it did for generals-relay.nginx.conf.

server {
    server_name quantstorm.mrinmoy.org;

    # The live websocket: turn-by-turn RPC for a running match. Kept in its
    # own location so only this path pays the upgrade headers and the long
    # timeout — a match can sit mid-negotiation between round trips for a
    # while, and the default proxy_read_timeout would sever a healthy,
    # merely-quiet connection out from under it.
    location /ws {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The dashboard: plain polled JSON/HTML, ordinary proxy behaviour.
    location / {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 80;
    listen [::]:80;
}
